<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><b> <pre>            Pete's Pizza Delivery</b></h1></pre>
    <h2><b> <pre>                       online order Form</b></h2></pre>
    <h3><pre>                               *required fields</pre></h3>
    <form >
        <fieldset>
            <legend>Customer details</legend>
            <label>*Name</label>
            <input type="text"><br><br>
            <label >*Address</label>
            <input type="text"><br> <br>
            <label>*Town/city</label>
            <input type="text"><br><br>
            <label >*Postcode</label>
            <input type="number"><br><br>
            <label >*Tel</label>
            <input type="tel"><br><br>
            <label >*Email</label>
            <input type="email">
        </fieldset> <br>
        <fieldset>
            <legend>Topping*</legend>
            <input type="radio" name="Topping">Margherita <br>
             <input type="radio" name="Topping">Meat Feast <br>
            <input type="radio" name="Topping">Four Seasons
        </fieldset><br>
        <fieldset>
            <legend>size*</legend>
            <input type="radio" name="size">Small <br>
             <input type="radio"  name="size">Medium <br>
              <input type="radio"  name="size">Large
        </fieldset><br>
        <fieldset>
            <legend>Extras</legend>
            <input type="checkbox">Mushrooms <br>
            <input type="checkbox">Green peppers <br>
            <input type="checkbox">Anchovies <br>
            <input type="checkbox">Extra cheese
        </fieldset> <br>
        <fieldset>
            <legend>Delivery</legend>
            <label >Preferred delivery time</label>
            <input type="time"> <br>
            <label >Delivery instructions:</label> <br>
            <textarea  rows="3" cols="100" ></textarea>
        </fieldset><br>
  <button>Sumbit order</button>

    </form>
</body>
</html>
